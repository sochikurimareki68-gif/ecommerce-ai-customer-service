# Render 蓝图（Blueprint）：把部署方式写成代码，推送仓库后在 Render 一键创建服务
# 文档：https://render.com/docs/blueprint-spec
#
# 用法：Render 控制台 → New → Blueprint → 选择本仓库 → 填 COZE_API_TOKEN → Apply

services:
  - type: web
    name: youmian-customer-service
    runtime: python
    plan: free                      # 免费版 15 分钟无访问会休眠，下次访问约需 1 分钟唤醒
    region: singapore               # 离国内最近；若提示区域不可用，删除本行改用默认区域
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py  # server.py 会读取环境变量 PORT 并监听 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      # 令牌只填在 Render 控制台，不写进代码、不提交仓库
      - key: COZE_API_TOKEN
        sync: false
      - key: COZE_BOT_ID
        value: "7694865098007035940"
      - key: COZE_API_BASE
        value: https://api.coze.cn
