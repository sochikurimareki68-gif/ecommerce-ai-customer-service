# 兜底探活（不是主方案）。GitHub 会把低活跃仓库的定时任务降频到 3.5-7 小时一次，
# 实测「配置了但没生效」。主方案是外部探活（cron-job.org / UptimeRobot，每 5 分钟），
# 接入步骤与失效排查见 docs/keepalive.md（G2）。
#
# 本文件保留作第二道保险；探活目标改为首页而不是 /api/health —— 健康检查被特意排除在
# 心跳统计之外，打 /api/health 不会刷新 last_activity_at。
#
# 面试前手动预热：Actions → Keepalive → Run workflow，或本地直接
#   curl https://youmian-customer-service.onrender.com/
#
# 回滚：删除本文件即可（服务功能不受影响）。

name: Keepalive

on:
  schedule:
    - cron: "*/5 * * * *"   # UTC，每 5 分钟
  workflow_dispatch: {}      # 支持手动触发，便于验证与预热

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 探活首页（会刷新 last_activity_at）
        run: |
          # 冷启动可能要 30-60s，失败重试 3 次；探活失败不代表代码有问题，
          # 一律不判 job 失败（真正的在线判读看 /api/health 的 uptime）。
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 180 \
              "https://youmian-customer-service.onrender.com/" || echo "000")
            echo "attempt ${i} → HTTP ${code}"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::warning::探活 3 次均未拿到 200，实例可能仍在冷启动"

      - name: 输出 health（仅供参考，不判失败）
        run: |
          curl -sS --max-time 60 \
            "https://youmian-customer-service.onrender.com/api/health" -o /tmp/health.json || true
          cat /tmp/health.json || true
          echo
