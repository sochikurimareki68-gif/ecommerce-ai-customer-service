<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>优眠小助手 · 人工接管（轻量版 · 只读）</title>
<style>
  /* ===== 色彩系统（和 demo.html 统一）===== */
  :root {
    --brand:      #2e5b4c;   /* 品牌绿 */
    --brand-dark: #1f4235;
    --brand-soft: #e4ede7;   /* 浅绿背景 */
    --sand:       #faf7ef;   /* 棉麻米 */
    --sand-2:     #f2eee3;
    --paper:      #ffffff;
    --ink:        #2c2416;
    --ink-2:      #5a4a30;
    --ink-3:      #8a7d64;
    --ink-4:      #b0a895;
    --ink-5:      #d9d4c8;
    --warn:       #c07650;   /* 柔和砖红 */
    --accent:     #c8b48a;   /* 原木金 */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
    background: var(--sand); color: var(--ink); height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* ===== 顶栏（原木渐变）===== */
  header {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    color: #fff; padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 {
    font-family: "Songti SC", serif; font-size: 18px; font-weight: 600;
    letter-spacing: 1px;
  }
  header .hint { font-size: 12px; color: #c8d6cf; margin-top: 2px; }
  header .hint b { color: #f0a040; }
  header .env { font-size: 11px; color: #c8d6cf; opacity: .8; }

  /* ===== 工具栏 ===== */
  .toolbar {
    background: var(--paper); border-bottom: 1px solid var(--ink-5);
    padding: 12px 24px; display: flex; gap: 10px; align-items: center;
  }
  .toolbar button {
    background: var(--brand); color: #fff; border: none;
    border-radius: 6px; padding: 7px 16px; font-size: 13px; cursor: pointer;
    transition: all .15s ease;
  }
  .toolbar button:hover {
    background: var(--brand-dark); transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(46,91,76,.3);
  }
  .toolbar button.ghost {
    background: transparent; border: 1px solid var(--ink-5); color: var(--ink-2);
  }
  .toolbar button.ghost:hover {
    background: var(--sand-2); border-color: var(--ink-3);
    box-shadow: none; transform: none;
  }
  .toolbar .spacer { flex: 1; }
  .counter { font-size: 13px; color: var(--ink-2); }
  .counter b {
    color: var(--warn); font-weight: 700; font-size: 20px;
    margin: 0 2px;
  }

  main {
    flex: 1; display: grid; grid-template-columns: 380px 1fr;
    overflow: hidden;
  }

  /* ===== 左：队列列表 ===== */
  .queue {
    background: var(--paper); border-right: 1px solid var(--ink-5);
    overflow-y: auto;
  }
  .queue::-webkit-scrollbar { width: 6px; }
  .queue::-webkit-scrollbar-thumb { background: var(--ink-5); border-radius: 3px; }

  .empty {
    padding: 60px 20px; text-align: center; color: var(--ink-3); font-size: 13px;
  }
  .empty .emoji { font-size: 44px; margin-bottom: 12px; opacity: .7; }
  .empty .title { font-size: 14px; color: var(--ink-2); margin-bottom: 4px; }

  .queue-item {
    position: relative;
    padding: 14px 18px 14px 22px; cursor: pointer;
    border-bottom: 1px solid var(--sand-2);
    transition: background .15s ease;
  }
  .queue-item::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: transparent;
    transition: background .15s ease;
  }
  .queue-item:hover { background: var(--sand); }
  .queue-item:hover::before { background: var(--accent); }
  .queue-item.active { background: var(--brand-soft); }
  .queue-item.active::before { background: var(--brand); }

  .q-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--ink-3); margin-bottom: 6px;
  }
  .q-meta .badge {
    background: var(--sand); color: var(--ink-2);
    padding: 2px 9px; border-radius: 10px; font-size: 10px;
    border: 1px solid var(--ink-5);
  }
  .queue-item.active .q-meta { color: var(--ink-2); }
  .queue-item.active .q-meta .badge {
    background: var(--brand); color: #fff; border-color: var(--brand);
  }

  .q-preview {
    font-size: 13px; color: var(--ink); line-height: 1.45;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .queue-item.active .q-preview { color: var(--ink); }
  .q-preview.ai {
    font-size: 12px; color: var(--ink-4); margin-top: 3px;
  }
  .queue-item.active .q-preview.ai { color: var(--ink-3); }

  /* ===== 右：对话详情 ===== */
  .detail {
    display: flex; flex-direction: column;
    background: var(--sand);
  }
  .detail-header {
    background: var(--paper); border-bottom: 1px solid var(--ink-5);
    padding: 14px 28px; display: flex; justify-content: space-between; align-items: center;
  }
  .detail-header h2 {
    font-size: 14px; color: var(--ink); font-weight: 600;
  }
  .detail-header h2 .sid {
    font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px;
    color: var(--ink-3); margin-left: 8px;
    padding: 2px 8px; background: var(--sand); border-radius: 4px;
    letter-spacing: .5px;
  }
  .detail-header .actions { display: flex; gap: 8px; }
  .detail-header .actions button {
    padding: 6px 14px; font-size: 12px;
  }

  .chat-flow {
    flex: 1; overflow-y: auto; padding: 28px;
    background: var(--sand);
  }
  .chat-flow::-webkit-scrollbar { width: 6px; }
  .chat-flow::-webkit-scrollbar-thumb { background: var(--ink-5); border-radius: 3px; }

  .chat-flow .msg {
    margin-bottom: 18px; display: flex; gap: 12px; align-items: flex-start;
    animation: msgIn .2s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .chat-flow .msg.user { justify-content: flex-end; }
  .chat-flow .msg .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .chat-flow .msg.user .avatar {
    background: var(--brand); color: #fff;
    box-shadow: 0 2px 6px rgba(46,91,76,.25);
  }
  .chat-flow .msg.assistant .avatar {
    background: var(--paper); border: 1px solid var(--ink-5);
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .chat-flow .bubble {
    max-width: 68%; padding: 11px 15px; border-radius: 12px;
    font-size: 13.5px; line-height: 1.6; word-break: break-word;
    white-space: pre-wrap;
  }
  .chat-flow .msg.user .bubble {
    background: var(--brand); color: #fff;
    border-bottom-right-radius: 3px;
    box-shadow: 0 2px 8px rgba(46,91,76,.2);
  }
  .chat-flow .msg.assistant .bubble {
    background: var(--paper); color: var(--ink);
    border-bottom-left-radius: 3px;
    border: 1px solid var(--ink-5);
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  .chat-flow .time {
    font-size: 10px; color: var(--ink-4); margin-top: 4px;
  }

  .detail-empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--ink-3); font-size: 14px;
  }
  .detail-empty .emoji { font-size: 54px; margin-bottom: 14px; opacity: .5; }

  .detail-footer {
    padding: 10px 28px; font-size: 11px; color: var(--ink-4);
    background: var(--paper); border-top: 1px solid var(--ink-5);
    display: flex; gap: 16px;
  }

  footer {
    padding: 10px 24px; font-size: 11px; color: var(--ink-4);
    background: var(--paper); border-top: 1px solid var(--ink-5);
    text-align: center;
  }
  footer b { color: var(--warn); }
</style>
</head>
<body>

<header>
  <div class="title">
    <h1>优眠小助手 · 人工接管面板</h1>
    <div class="hint">轻量版 · <b>只读</b> · 标记已处理 · 无人工下发能力</div>
  </div>
  <div class="env">
    <span style="font-size:11px;color:#a8a59e;">v2.0.3 · server.py 1.13 · I-4</span>
  </div>
</header>

<div class="toolbar">
  <button onclick="refresh()">🔄 刷新队列</button>
  <span class="counter">待处理 <b id="pendingCount">0</b> 条</span>
  <div class="spacer"></div>
  <button class="ghost" onclick="refresh()">查看所有</button>
</div>

<main>
  <!-- 左：队列列表 -->
  <section class="queue" id="queueList">
    <div class="empty">
      <div class="emoji">📭</div>
      加载中...
    </div>
  </section>

  <!-- 右：对话详情 -->
  <section class="detail" id="detail">
    <div class="detail-empty">
      <div class="emoji">👈</div>
      从左边选择一条待接管会话查看详情
    </div>
  </section>
</main>

<footer>
  ⚠️ 轻量版：人工接管后不会向用户下发任何回复。需要回复用户请通过电话/IM 等其他渠道。
  面试时可说明"下一步加 resolved 标记 + 审计日志 + token 鉴权"。
</footer>

<script>
const BASE = window.location.origin;
let selectedSid = null;

async function refresh() {
  try {
    const r = await fetch(BASE + "/api/pending");
    const data = await r.json();
    document.getElementById("pendingCount").textContent = data.pending;
    renderQueue(data.items);
  } catch (e) {
    document.getElementById("queueList").innerHTML =
      '<div class="empty"><div class="emoji">❌</div>连接后端失败，请确认 server.py 正在运行</div>';
  }
}

function renderQueue(items) {
  const el = document.getElementById("queueList");
  if (!items.length) {
    el.innerHTML = '<div class="empty"><div class="emoji">🎉</div>队列干净，暂无待接管会话</div>';
    return;
  }
  el.innerHTML = items.map(item => `
    <div class="queue-item ${selectedSid === item.session_id ? 'active' : ''}"
         onclick="selectItem('${item.session_id}')">
      <div class="q-meta">
        <span>${item.time_str} · IP ${item.user_ip_hash.slice(0,8)}…</span>
        <span class="badge">${item.msg_count} 条消息</span>
      </div>
      <div class="q-preview">👤 ${item.last_user}</div>
      <div class="q-preview" style="font-size:12px;color:#a8a59e;margin-top:2px;">🤖 ${item.last_reply_preview}</div>
    </div>
  `).join("");
}

async function selectItem(sid) {
  selectedSid = sid;
  refresh(); // 更新高亮
  try {
    const r = await fetch(BASE + "/api/session/" + encodeURIComponent(sid));
    if (!r.ok) { throw new Error("not found"); }
    const data = await r.json();
    renderDetail(data);
  } catch (e) {
    document.getElementById("detail").innerHTML =
      '<div class="detail-empty"><div class="emoji">❓</div>会话不存在或已被清理</div>';
  }
}

function renderDetail(data) {
  const msgs = data.messages.map(m => {
    if (m.role === "user") {
      return `<div class="msg user">
        <div class="bubble">${escapeHtml(m.text)}</div>
        <div class="avatar">👤</div>
      </div>`;
    }
    return `<div class="msg assistant">
      <div class="avatar">🤖</div>
      <div>
        <div class="bubble">${escapeHtml(m.text)}</div>
        <div class="time">${m.time}</div>
      </div>
    </div>`;
  }).join("");

  document.getElementById("detail").innerHTML = `
    <div class="detail-header">
      <h2>完整对话 <span class="sid">session_id: ${data.session_id}…</span></h2>
      <div class="actions">
        <button class="ghost" onclick="selectItem('${data.session_id}')">🔄 刷新详情</button>
        <button onclick="resolve('${data.session_id}')">✅ 标记已处理</button>
      </div>
    </div>
    <div class="chat-flow">${msgs}</div>
    <div style="padding:8px 24px;font-size:11px;color:#a8a59e;border-top:1px solid #e8e0d1;background:#fff;">
      入队时间 ${data.time_str} · 用户 IP 哈希 ${data.user_ip_hash} · 轻量版只读，无法在此回复用户
    </div>
  `;
}

async function resolve(sid) {
  if (!confirm("标记已处理？该会话将从队列移除。\n\n注意：轻量版不会向用户下发任何回复。")) return;
  try {
    const r = await fetch(BASE + "/api/resolve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sid })
    });
    if (!r.ok) throw new Error("resolve failed");
    selectedSid = null;
    document.getElementById("detail").innerHTML =
      '<div class="detail-empty"><div class="emoji">👈</div>已处理，从队列选择下一条</div>';
    refresh();
  } catch (e) {
    alert("标记失败：" + e.message);
  }
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

// 启动
refresh();
// 每 10 秒自动刷新（演示时方便，生产可关）
setInterval(refresh, 10000);
</script>
</body>
</html>
