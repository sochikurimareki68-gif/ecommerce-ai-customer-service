<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>优眠小助手 · 人工接管（轻量版 · 只读）</title>
<style>
  /* ===== 色彩系统（和 demo.html 统一）===== */
  :root {
    --brand:      #2e5b4c;   /* 品牌绿 */
    --brand-dark: #1f4235;
    --brand-soft: #e4ede7;   /* 浅绿背景 */
    --sand:       #faf7ef;   /* 棉麻米 */
    --sand-2:     #f2eee3;
    --paper:      #ffffff;
    --ink:        #2c2416;
    --ink-2:      #5a4a30;
    --ink-3:      #8a7d64;
    --ink-4:      #b0a895;
    --ink-5:      #d9d4c8;
    --warn:       #c07650;   /* 柔和砖红 */
    --accent:     #c8b48a;   /* 原木金 */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
    background: var(--sand); color: var(--ink); height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* ===== 顶栏（原木渐变）===== */
  header {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    color: #fff; padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 {
    font-family: "Songti SC", serif; font-size: 18px; font-weight: 600;
    letter-spacing: 1px;
  }
  header .hint { font-size: 12px; color: #c8d6cf; margin-top: 2px; }
  header .hint b { color: #f0a040; }
  header .env { font-size: 11px; color: #c8d6cf; opacity: .8; }

  /* ===== 工具栏 ===== */
  .toolbar {
    background: var(--paper); border-bottom: 1px solid var(--ink-5);
    padding: 12px 24px; display: flex; gap: 10px; align-items: center;
  }
  .toolbar button {
    background: var(--brand); color: #fff; border: none;
    border-radius: 6px; padding: 7px 16px; font-size: 13px; cursor: pointer;
    transition: all .15s ease;
  }
  .toolbar button:hover {
    background: var(--brand-dark); transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(46,91,76,.3);
  }
  .toolbar button.ghost {
    background: transparent; border: 1px solid var(--ink-5); color: var(--ink-2);
  }
  .toolbar button.ghost:hover {
    background: var(--sand-2); border-color: var(--ink-3);
    box-shadow: none; transform: none;
  }
  .toolbar .spacer { flex: 1; }
  .counter { font-size: 13px; color: var(--ink-2); }
  .counter b {
    color: var(--warn); font-weight: 700; font-size: 20px;
    margin: 0 2px;
  }

  main {
    flex: 1; display: grid; grid-template-columns: 380px 1fr;
    overflow: hidden;
  }

  /* ===== 左：队列列表 ===== */
  .queue {
    background: var(--paper); border-right: 1px solid var(--ink-5);
    overflow-y: auto;
  }
  .queue::-webkit-scrollbar { width: 6px; }
  .queue::-webkit-scrollbar-thumb { background: var(--ink-5); border-radius: 3px; }

  .empty {
    padding: 60px 20px; text-align: center; color: var(--ink-3); font-size: 13px;
  }
  .empty .emoji { font-size: 44px; margin-bottom: 12px; opacity: .7; }
  .empty .title { font-size: 14px; color: var(--ink-2); margin-bottom: 4px; }

  .queue-item {
    position: relative;
    padding: 14px 18px 14px 22px; cursor: pointer;
    border-bottom: 1px solid var(--sand-2);
    transition: background .15s ease;
  }
  .queue-item::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: transparent;
    transition: background .15s ease;
  }
  .queue-item:hover { background: var(--sand); }
  .queue-item:hover::before { background: var(--accent); }
  .queue-item.active { background: var(--brand-soft); }
  .queue-item.active::before { background: var(--brand); }

  .q-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--ink-3); margin-bottom: 6px;
  }
  .q-meta .badge {
    background: var(--sand); color: var(--ink-2);
    padding: 2px 9px; border-radius: 10px; font-size: 10px;
    border: 1px solid var(--ink-5);
  }
  .queue-item.active .q-meta { color: var(--ink-2); }
  .queue-item.active .q-meta .badge {
    background: var(--brand); color: #fff; border-color: var(--brand);
  }

  .q-preview {
    font-size: 13px; color: var(--ink); line-height: 1.45;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .queue-item.active .q-preview { color: var(--ink); }
  .q-preview.ai {
    font-size: 12px; color: var(--ink-4); margin-top: 3px;
  }
  .queue-item.active .q-preview.ai { color: var(--ink-3); }

  /* ===== 右：对话详情 ===== */
  .detail {
    display: flex; flex-direction: column;
    background: var(--sand);
  }
  .detail-header {
    background: var(--paper); border-bottom: 1px solid var(--ink-5);
    padding: 14px 28px; display: flex; justify-content: space-between; align-items: center;
  }
  .detail-header h2 {
    font-size: 14px; color: var(--ink); font-weight: 600;
  }
  .detail-header h2 .sid {
    font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px;
    color: var(--ink-3); margin-left: 8px;
    padding: 2px 8px; background: var(--sand); border-radius: 4px;
    letter-spacing: .5px;
  }
  .detail-header .actions { display: flex; gap: 8px; }
  .detail-header .actions button {
    padding: 6px 14px; font-size: 12px;
  }

  .chat-flow {
    flex: 1; overflow-y: auto; padding: 28px;
    background: var(--sand);
  }
  .chat-flow::-webkit-scrollbar { width: 6px; }
  .chat-flow::-webkit-scrollbar-thumb { background: var(--ink-5); border-radius: 3px; }

  .chat-flow .msg {
    margin-bottom: 18px; display: flex; gap: 12px; align-items: flex-start;
    animation: msgIn .2s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .chat-flow .msg.user { justify-content: flex-end; }
  .chat-flow .msg .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .chat-flow .msg.user .avatar {
    background: var(--brand); color: #fff;
    box-shadow: 0 2px 6px rgba(46,91,76,.25);
  }
  .chat-flow .msg.assistant .avatar {
    background: var(--paper); border: 1px solid var(--ink-5);
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .chat-flow .bubble {
    max-width: 68%; padding: 11px 15px; border-radius: 12px;
    font-size: 13.5px; line-height: 1.6; word-break: break-word;
    white-space: pre-wrap;
  }
  .chat-flow .msg.user .bubble {
    background: var(--brand); color: #fff;
    border-bottom-right-radius: 3px;
    box-shadow: 0 2px 8px rgba(46,91,76,.2);
  }
  .chat-flow .msg.assistant .bubble {
    background: var(--paper); color: var(--ink);
    border-bottom-left-radius: 3px;
    border: 1px solid var(--ink-5);
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  .chat-flow .time {
    font-size: 10px; color: var(--ink-4); margin-top: 4px;
  }

  .detail-empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--ink-3); font-size: 14px;
  }
  .detail-empty .emoji { font-size: 54px; margin-bottom: 14px; opacity: .5; }

  .detail-footer {
    padding: 10px 28px; font-size: 11px; color: var(--ink-4);
    background: var(--paper); border-top: 1px solid var(--ink-5);
    display: flex; gap: 16px;
  }

  footer {
    padding: 10px 24px; font-size: 11px; color: var(--ink-4);
    background: var(--paper); border-top: 1px solid var(--ink-5);
    text-align: center;
  }
  footer b { color: var(--warn); }
</style>
</head>
<body>

<header>
  <div class="title">
    <h1>优眠小助手 · 人工接管面板</h1>
    <div class="hint">轻量版 · <b>只读</b> · 标记已处理 · 无人工下发能力</div>
  </div>
  <div class="env">
    <span style="font-size:11px;color:#a8a59e;">v2.0.3 · server.py 1.14 · I-4</span>
  </div>
</header>

<div class="toolbar">
  <button onclick="refresh()">🔄 刷新队列</button>
  <span class="counter">待处理 <b id="pendingCount">0</b> 条</span>
  <div class="spacer"></div>
  <button class="ghost" onclick="refresh()">查看所有</button>
</div>

<main>
  <!-- 左：队列列表 -->
  <section class="queue" id="queueList">
    <div class="empty">
      <div class="emoji">📭</div>
      加载中...
    </div>
  </section>

  <!-- 右：对话详情 -->
  <section class="detail" id="detail">
    <div class="detail-empty">
      <div class="emoji">👈</div>
      从左边选择一条待接管会话查看详情
    </div>
  </section>
</main>

<footer>
  ⚠️ 轻量版：人工接管后不会向用户下发任何回复。需要回复用户请通过电话/IM 等其他渠道。
  管理接口已启用口令鉴权（服务端 ADMIN_TOKEN）。
</footer>

<script>
const BASE = window.location.origin;
const TOKEN_KEY = "ym_admin_token";
let adminToken = sessionStorage.getItem(TOKEN_KEY) || "";
let selectedSid = null;
let autoTimer = null;

function promptToken() {
  const input = prompt("请输入管理口令（服务端环境变量 ADMIN_TOKEN）");
  if (input && input.trim()) {
    adminToken = input.trim();
    sessionStorage.setItem(TOKEN_KEY, adminToken);
  }
  return adminToken;
}

class AdminError extends Error {
  // kind：auth（未输入/口令错误）、disabled（服务端未配 ADMIN_TOKEN）、
  //       network（请求没到服务端）、notfound（会话已清理）、server（其他服务端错误）
  constructor(kind, message) {
    super(message);
    this.kind = kind;
  }
}

async function adminFetch(path, opts = {}) {
  if (!adminToken && !promptToken()) {
    throw new AdminError("auth", "未输入管理口令");
  }
  const headers = Object.assign({}, opts.headers || {}, { "X-Admin-Token": adminToken });
  let r;
  try {
    r = await fetch(BASE + path, Object.assign({}, opts, { headers }));
  } catch (e) {
    // fetch 抛异常只代表网络层失败（断网/DNS/服务不可达），与口令错误无关，必须分开提示
    throw new AdminError("network", "无法连接后端服务，请检查网络后重试");
  }
  if (r.status === 401 || r.status === 403) {
    const data = await r.json().catch(() => ({}));
    throw new AdminError("auth", data.error || "管理口令不正确");
  }
  if (r.status === 503) {
    const data = await r.json().catch(() => ({}));
    throw new AdminError("disabled", data.error || "服务端未配置管理口令，接管接口已关闭");
  }
  if (r.status === 404) {
    throw new AdminError("notfound", "会话不存在或已被清理");
  }
  if (!r.ok) {
    throw new AdminError("server", `服务端返回错误（HTTP ${r.status}）`);
  }
  return r;
}

function describeError(err) {
  if (err instanceof AdminError) return { kind: err.kind, text: err.message };
  // 例如 200 但响应体不是 JSON
  return { kind: "server", text: "服务端返回了无法解析的数据，请稍后重试" };
}

function authError(message) {
  adminToken = "";
  sessionStorage.removeItem(TOKEN_KEY);
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  document.getElementById("queueList").innerHTML =
    `<div class="empty"><div class="emoji">🔒</div>${escapeHtml(message)}<br>点击「刷新队列」重新输入口令</div>`;
}

function showQueueError(err) {
  const { kind, text } = describeError(err);
  if (kind === "auth") {
    authError(text);
    return;
  }
  // 服务端没配口令时接口按设计关闭，用锁图标与「故障」区分开
  const emoji = kind === "disabled" ? "🔒" : "❌";
  document.getElementById("queueList").innerHTML =
    `<div class="empty"><div class="emoji">${emoji}</div>${escapeHtml(text)}</div>`;
}

async function refresh() {
  try {
    const r = await adminFetch("/api/pending");
    const data = await r.json();
    document.getElementById("pendingCount").textContent = data.pending;
    renderQueue(data.items);
    if (!autoTimer) autoTimer = setInterval(refresh, 10000);
  } catch (e) {
    showQueueError(e);
  }
}

function renderQueue(items) {
  const el = document.getElementById("queueList");
  if (!items.length) {
    el.innerHTML = '<div class="empty"><div class="emoji">🎉</div>队列干净，暂无待接管会话</div>';
    return;
  }
  // 用 DOM 节点逐项构建：session_id 只进 dataset，不参与任何 HTML/JS 字符串拼接
  el.innerHTML = "";
  items.forEach(item => {
    const div = document.createElement("div");
    div.className = "queue-item" + (selectedSid === item.session_id ? " active" : "");
    div.dataset.sid = item.session_id;

    const meta = document.createElement("div");
    meta.className = "q-meta";
    const when = document.createElement("span");
    when.textContent = `${item.time_str} · IP ${String(item.user_ip_hash || "").slice(0, 8)}…`;
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = `${item.msg_count} 条消息`;
    meta.append(when, badge);

    const preview = document.createElement("div");
    preview.className = "q-preview";
    preview.textContent = `👤 ${item.last_user || ""}`;

    const reply = document.createElement("div");
    reply.className = "q-preview";
    reply.style.fontSize = "12px";
    reply.style.color = "#a8a59e";
    reply.style.marginTop = "2px";
    reply.textContent = `🤖 ${item.last_reply_preview || ""}`;

    div.append(meta, preview, reply);
    el.appendChild(div);
  });
}

// 事件委托：队列项点击统一在这里处理，服务端数据不出现在内联 onclick 里
document.getElementById("queueList").addEventListener("click", ev => {
  const item = ev.target.closest(".queue-item");
  if (!item || !item.dataset.sid) return;
  selectItem(item.dataset.sid);
});

async function selectItem(sid) {
  selectedSid = sid;
  refresh(); // 更新高亮
  try {
    const r = await adminFetch("/api/session/" + encodeURIComponent(sid));
    const data = await r.json();
    renderDetail(data);
  } catch (e) {
    const { kind, text } = describeError(e);
    if (kind === "auth") {
      authError(text);
      return;
    }
    const emoji = kind === "notfound" ? "❓" : "❌";
    document.getElementById("detail").innerHTML =
      `<div class="detail-empty"><div class="emoji">${emoji}</div>${escapeHtml(text)}</div>`;
  }
}

function renderDetail(data) {
  const msgs = data.messages.map(m => {
    if (m.role === "user") {
      return `<div class="msg user">
        <div>
          <div class="bubble">${escapeHtml(m.text)}</div>
          <div class="time" style="text-align:right">${escapeHtml(m.time)}</div>
        </div>
        <div class="avatar">👤</div>
      </div>`;
    }
    return `<div class="msg assistant">
      <div class="avatar">🤖</div>
      <div>
        <div class="bubble">${escapeHtml(m.text)}</div>
        <div class="time">${escapeHtml(m.time)}</div>
      </div>
    </div>`;
  }).join("");
  const sidShort = escapeHtml(data.session_id_short || data.session_id.slice(0, 12));
  const rounds = Number(data.context_rounds) || Math.ceil(data.messages.length / 2);

  document.getElementById("detail").innerHTML = `
    <div class="detail-header">
      <h2>最近 ${escapeHtml(String(rounds))} 轮对话 <span class="sid">session_id: ${sidShort}…</span></h2>
      <div class="actions">
        <button class="ghost" id="btnRefreshDetail">🔄 刷新详情</button>
        <button id="btnResolve">✅ 标记已处理</button>
      </div>
    </div>
    <div class="chat-flow">${msgs}</div>
    <div style="padding:8px 24px;font-size:11px;color:#a8a59e;border-top:1px solid #e8e0d1;background:#fff;">
      入队时间 ${escapeHtml(data.time_str)} · 用户 IP 哈希 ${escapeHtml(data.user_ip_hash)} · 轻量版只读，无法在此回复用户
    </div>
  `;
  // 按钮事件用监听器绑定，session_id 不作为内联 JS 字符串拼进页面
  document.getElementById("btnRefreshDetail").addEventListener("click", () => selectItem(data.session_id));
  document.getElementById("btnResolve").addEventListener("click", () => resolve(data.session_id));
}

async function resolve(sid) {
  if (!confirm("标记已处理？该会话将从队列移除。\n\n注意：轻量版不会向用户下发任何回复。")) return;
  try {
    await adminFetch("/api/resolve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sid })
    });
    selectedSid = null;
    document.getElementById("detail").innerHTML =
      '<div class="detail-empty"><div class="emoji">👈</div>已处理，从队列选择下一条</div>';
    refresh();
  } catch (e) {
    const { kind, text } = describeError(e);
    if (kind === "auth") {
      authError(text);
      return;
    }
    alert("标记失败：" + text);
  }
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

// 启动：首次会提示输入管理口令，输入后存在 sessionStorage
refresh();
</script>
</body>
</html>
