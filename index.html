<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>优眠家居 - AI智能客服</title>
<style>
  /* ================= 设计变量 ================= */
  :root {
    color-scheme: light;

    --page-bg: linear-gradient(165deg, #F4F1EB 0%, #E8E3D9 100%);
    --card: #FFFFFF;

    --ink: #1B2422;
    --ink-2: #4B5A53;
    --muted: #8A938D;
    --faint: #AAB2AC;

    --line: #F0ECE5;
    --line-2: #E6E0D6;
    --chat-bg: #F8F6F2;
    --dot: rgba(42, 107, 92, 0.05);

    --accent: #2A6B5C;
    --accent-2: #35796A;
    --accent-soft: #EAF3F0;
    --accent-ring: rgba(42, 107, 92, 0.14);
    --bubble: #FFFFFF;
    --bubble-line: #EDE9E2;

    --notice-bg: #FBF7EE;
    --notice-line: #F1E9D8;
    --notice-ink: #8A7433;
    --notice-icon: #B08A34;

    --header-a: #24564E;
    --header-b: #2E7263;
    --header-c: #3A8974;

    --shadow-card:
      0 28px 64px -24px rgba(28, 45, 40, 0.30),
      0 4px 14px -6px rgba(28, 45, 40, 0.08);
    --shadow-user: 0 6px 16px -8px rgba(36, 86, 78, 0.55);
    --shadow-fab: 0 8px 20px -8px rgba(28, 45, 40, 0.35);

    --radius-card: 28px;
    --radius-bubble: 18px;
    --radius-full: 999px;

    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;

      --page-bg: linear-gradient(165deg, #14191A 0%, #0D1112 100%);
      --card: #1A201E;

      --ink: #E7EDEA;
      --ink-2: #B4C0BA;
      --muted: #8A968F;
      --faint: #6E7972;

      --line: #262D2A;
      --line-2: #303834;
      --chat-bg: #151A19;
      --dot: rgba(122, 224, 184, 0.05);

      --accent: #4FBFA0;
      --accent-2: #5FCDAF;
      --accent-soft: rgba(79, 191, 160, 0.12);
      --accent-ring: rgba(79, 191, 160, 0.20);
      --bubble: #212927;
      --bubble-line: #2E3633;

      --notice-bg: #221E14;
      --notice-line: #332C1C;
      --notice-ink: #C7A75B;
      --notice-icon: #A8873C;

      --header-a: #1B4A41;
      --header-b: #255F52;
      --header-c: #2E7263;

      --shadow-card:
        0 28px 64px -24px rgba(0, 0, 0, 0.60),
        0 4px 14px -6px rgba(0, 0, 0, 0.35);
      --shadow-user: 0 6px 16px -8px rgba(0, 0, 0, 0.55);
      --shadow-fab: 0 8px 20px -8px rgba(0, 0, 0, 0.55);
    }
  }

  /* ================= 基础 ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--page-bg);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ================= 卡片外壳 ================= */
  .chat-container {
    width: min(440px, 100%);
    height: min(800px, calc(100vh - 48px));
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ================= 头部 ================= */
  .chat-header {
    position: relative;
    flex: 0 0 auto;
    padding: 19px 22px;
    background: linear-gradient(135deg, var(--header-a) 0%, var(--header-b) 58%, var(--header-c) 100%);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 13px;
    overflow: hidden;
  }
  .chat-header::after {
    content: "";
    position: absolute;
    top: -78px; right: -46px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.18), transparent 68%);
    pointer-events: none;
  }
  .chat-header .avatar {
    flex: 0 0 46px;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.20);
    border: 1px solid rgba(255, 255, 255, 0.32);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    display: grid;
    place-items: center;
    font-size: 23px;
    line-height: 1;
  }
  .chat-header .info { min-width: 0; }
  .chat-header .info h1 {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: 0.01em;
  }
  .chat-header .info p {
    font-size: 12px;
    line-height: 1.4;
    opacity: 0.78;
    margin-top: 1px;
  }
  .status-pill {
    margin-left: auto;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px 5px 10px;
    border-radius: var(--radius-full);
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.26);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .status-pill i {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #7BE0B8;
    box-shadow: 0 0 0 3px rgba(123, 224, 184, 0.22);
  }

  /* ================= 提示条 ================= */
  .online-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 20px;
    background: var(--notice-bg);
    border-bottom: 1px solid var(--notice-line);
  }
  .online-bar svg { flex: 0 0 auto; color: var(--notice-icon); }
  .online-bar span {
    flex: 1;
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--notice-ink);
  }
  .online-bar a {
    flex: 0 0 auto;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    padding: 4px 11px;
    border-radius: var(--radius-full);
    background: var(--accent-soft);
    white-space: nowrap;
    transition: filter 0.18s ease;
  }
  .online-bar a:hover { filter: brightness(0.96); }

  /* ================= 消息区 ================= */
  .messages-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px 6px;
    background: var(--chat-bg);
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 22px 22px;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--line-2) transparent;
  }
  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb {
    background: var(--line-2);
    border-radius: var(--radius-full);
  }

  /* 日期分隔 */
  .day-divider {
    display: flex;
    justify-content: center;
    margin-bottom: 18px;
  }
  .day-divider span {
    font-size: 10.5px;
    color: var(--muted);
    padding: 3px 11px;
    border-radius: var(--radius-full);
    background: var(--line);
  }

  /* 空状态引导 */
  .empty-hint {
    margin: 6px 0 20px;
    padding: 14px 16px;
    border: 1px dashed var(--line-2);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.5);
  }
  .empty-hint .eh-title {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.03em;
    margin-bottom: 9px;
  }
  .empty-hint ul { list-style: none; display: grid; gap: 7px; }
  .empty-hint li {
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink-2);
    cursor: pointer;
    padding: 7px 11px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    transition: border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
  }
  .empty-hint li:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateX(2px);
  }
  .empty-hint.hidden { display: none; }

  /* 消息 */
  .message {
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    animation: rise 0.28s cubic-bezier(0.22, 0.8, 0.3, 1) both;
  }
  .message.bot { align-items: flex-start; }
  .message.user { align-items: flex-end; }
  .message .bubble {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: var(--radius-bubble);
    font-size: 14px;
    line-height: 1.68;
    word-break: break-word;
    white-space: pre-wrap;   /* 保留换行；配合 textContent 渲染，不依赖 <br> */
  }
  .message.bot .bubble {
    background: var(--bubble);
    color: var(--ink);
    border: 1px solid var(--bubble-line);
    border-bottom-left-radius: 6px;
    box-shadow: 0 1px 2px rgba(28, 45, 40, 0.04);
  }
  .message.user .bubble {
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: #fff;
    border-bottom-right-radius: 6px;
    box-shadow: var(--shadow-user);
  }
  .message .time {
    font-size: 10.5px;
    color: var(--faint);
    margin-top: 6px;
    padding: 0 4px;
    letter-spacing: 0.02em;
  }

  /* 流式光标 */
  .bubble.streaming::after {
    content: "";
    display: inline-block;
    width: 6px; height: 14px;
    margin-left: 3px;
    vertical-align: -2px;
    border-radius: 1.5px;
    background: var(--accent);
    animation: caret 1s steps(1) infinite;
  }

  /* 正在输入 */
  .typing { display: inline-flex; align-items: center; gap: 5px; padding: 3px 1px; }
  .typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.28;
    animation: blink 1.3s ease-in-out infinite both;
  }
  .typing span:nth-child(2) { animation-delay: 0.18s; }
  .typing span:nth-child(3) { animation-delay: 0.36s; }

  /* 回到最新 */
  .to-bottom {
    position: absolute;
    right: 14px;
    bottom: 14px;
    width: 34px; height: 34px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--line-2);
    color: var(--accent);
    cursor: pointer;
    box-shadow: var(--shadow-fab);
    opacity: 0;
    transform: translateY(6px) scale(0.94);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .to-bottom.show { opacity: 1; transform: none; pointer-events: auto; }
  .to-bottom:hover { border-color: var(--accent); }

  /* ================= 快捷提问 ================= */
  .quick-replies {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 20px;
    background: var(--card);
    border-top: 1px solid var(--line);
  }
  .quick-reply {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 13px;
    border-radius: var(--radius-full);
    background: var(--chat-bg);
    border: 1px solid var(--line-2);
    color: var(--ink-2);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease, transform 0.18s ease;
  }
  .quick-reply .qi { font-size: 13px; line-height: 1; }
  .quick-reply:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-1px);
  }
  .quick-reply:active { transform: translateY(0); }

  /* ================= 输入区 ================= */
  .chat-input {
    flex: 0 0 auto;
    padding: 12px 16px 10px;
    background: var(--card);
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .input-row { display: flex; align-items: center; gap: 10px; }
  .chat-input input {
    flex: 1;
    min-width: 0;
    padding: 12px 18px;
    background: var(--chat-bg);
    border: 1px solid transparent;
    border-radius: var(--radius-full);
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .chat-input input::placeholder { color: var(--faint); }
  .chat-input input:focus {
    background: var(--card);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }
  .chat-input button {
    flex: 0 0 auto;
    width: 42px; height: 42px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: #fff;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: var(--shadow-user);
    transition: transform 0.16s ease, filter 0.16s ease, opacity 0.16s ease, box-shadow 0.16s ease;
  }
  .chat-input button:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .chat-input button:active { transform: translateY(0); filter: brightness(0.96); }
  .chat-input button:disabled {
    background: var(--line-2);
    color: var(--muted);
    box-shadow: none;
    cursor: default;
    filter: none;
    transform: none;
    opacity: 0.75;
  }
  .chat-input button:focus-visible,
  .quick-reply:focus-visible,
  .online-bar a:focus-visible,
  .to-bottom:focus-visible,
  .empty-hint li:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .disclaimer {
    text-align: center;
    font-size: 10.5px;
    color: var(--faint);
    letter-spacing: 0.02em;
  }

  /* 后端未就绪 / 不可用时的状态 */
  .notice-line {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin: 2px 0 14px;
  }
  .chat-input input:disabled { cursor: not-allowed; opacity: 0.65; }
  body[data-mode="checking"] .quick-reply,
  body[data-mode="checking"] .empty-hint li,
  body[data-mode="unavailable"] .quick-reply,
  body[data-mode="unavailable"] .empty-hint li {
    opacity: 0.45;
    pointer-events: none;
  }

  /* ================= 动效 ================= */
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.28; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-2px); }
  }
  @keyframes caret {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ================= 移动端 ================= */
  @media (max-width: 480px) {
    body { padding: 0; }
    .chat-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }
    .chat-header { padding: 16px 18px; }
    .chat-messages { padding: 16px 16px 6px; }
    .quick-replies { padding: 10px 16px; }
    .empty-hint li { font-size: 12.5px; }
  }
</style>
</head>
<body data-mode="checking">

<div class="chat-container">
  <!-- 头部 -->
  <div class="chat-header">
    <div class="avatar">🛏️</div>
    <div class="info">
      <h1>优眠小助手</h1>
      <p>优眠家居 · 智能客服</p>
    </div>
    <span class="status-pill"><i></i>在线</span>
  </div>

  <!-- 顶部说明 / 源码入口 -->
  <div class="online-bar">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 11v5M12 7.8h.01"></path>
    </svg>
    <span>本页为界面演示，项目完整实现（人设 Prompt / 知识库 / 对话流设计）见源码仓库</span>
    <a href="https://github.com/sochikurimareki68-gif/ecommerce-ai-customer-service" target="_blank" rel="noopener">查看源码 →</a>
  </div>

  <!-- 消息区 -->
  <div class="messages-wrap">
    <div class="chat-messages" id="messages">
      <div class="day-divider"><span>今天</span></div>

      <div class="message bot">
        <div class="bubble">亲，您好！😊 欢迎来到优眠家居，我是智能客服小助手。我可以帮您解答商品信息、洗护方式、发货物流、退换货等问题。请问有什么可以帮您的呢？</div>
        <div class="time" id="welcome-time"></div>
      </div>

      <div class="empty-hint" id="emptyHint">
        <div class="eh-title">你可以这样问我</div>
        <ul>
          <li tabindex="0" onclick="sendQuick('1.5 米的床该选什么尺寸的四件套？')" onkeypress="if(event.key==='Enter') this.click()">1.5 米的床该选什么尺寸的四件套？</li>
          <li tabindex="0" onclick="sendQuick('纯棉床品第一次洗要注意什么？')" onkeypress="if(event.key==='Enter') this.click()">纯棉床品第一次洗要注意什么？</li>
          <li tabindex="0" onclick="sendQuick('现在有什么优惠活动？')" onkeypress="if(event.key==='Enter') this.click()">现在有什么优惠活动？</li>
        </ul>
      </div>
    </div>

    <button class="to-bottom" id="toBottom" type="button" aria-label="回到最新消息">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14"></path>
        <path d="M5.5 12.5L12 19l6.5-6.5"></path>
      </svg>
    </button>
  </div>

  <!-- 快捷提问 -->
  <div class="quick-replies" id="quickReplies">
    <span class="quick-reply" onclick="sendQuick('四件套有哪些尺寸？')"><span class="qi">🛍️</span>商品咨询</span>
    <span class="quick-reply" onclick="sendQuick('纯棉床品怎么洗？')"><span class="qi">🧺</span>洗护方式</span>
    <span class="quick-reply" onclick="sendQuick('多久能发货？')"><span class="qi">🚚</span>发货时效</span>
    <span class="quick-reply" onclick="sendQuick('退货流程是什么？')"><span class="qi">🔄</span>退换货</span>
    <span class="quick-reply" onclick="sendQuick('现在有什么优惠活动？')"><span class="qi">🎁</span>优惠活动</span>
    <span class="quick-reply" onclick="sendQuick('转人工客服')"><span class="qi">🎧</span>转人工</span>
  </div>

  <!-- 输入区 -->
  <div class="chat-input">
    <div class="input-row">
      <input type="text" id="input" placeholder="连接服务中…" autocomplete="off" disabled onkeypress="if(event.key==='Enter') sendMessage()">
      <button type="button" id="sendBtn" onclick="sendMessage()" aria-label="发送">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19.5V5"></path>
          <path d="M5.5 11.5L12 5l6.5 6.5"></path>
        </svg>
      </button>
    </div>
    <p class="disclaimer">内容由 AI 生成，仅供参考</p>
  </div>
</div>

<script>
  // ==========================================
  //  优眠家居 AI 智能客服 - 前端页面
  //
  //  两种运行形态（页面加载时自动判断）：
  //   · 有后端代理（server.py）→ 调用 /api/chat，与真实智能体流式对话
  //   · 纯静态托管（如 GitHub Pages）→ 自动降级为内置模拟回复的界面演示
  //
  //  ⚠️ 前端不存放任何令牌；令牌只保存在服务端的 .env 里
  // ==========================================

  // ---------- 运行模式 ----------
  //   checking     正在探测 / 等待后端就绪（期间禁止提问，避免拿到假答案）
  //   live         后端可用 → 真实对话
  //   demo         已确认没有后端（如 GitHub Pages 静态托管）→ 走内置模拟回复演示
  //   unavailable  后端存在但一直没起来 → 明确报错，不假装成功
  let mode = 'checking';
  let tokenReady = false;
  // 身份与会话都由服务端持有（见 server.py 的 SessionStore），
  // 前端只带一个 HttpOnly cookie，不再自己生成 user_id / 回传 conversation_id

  const msgBox = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  // 获取时间
  function getTime() {
    const now = new Date();
    return now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  }
  document.getElementById('welcome-time').textContent = getTime();

  // ---------- 界面状态 ----------

  // 用户是否停留在底部（用于决定要不要自动跟随新消息）
  function isNearBottom() {
    return msgBox.scrollHeight - msgBox.scrollTop - msgBox.clientHeight < 80;
  }

  function scrollToBottom(smooth) {
    if (smooth) {
      msgBox.scrollTo({ top: msgBox.scrollHeight, behavior: 'smooth' });
    } else {
      msgBox.scrollTop = msgBox.scrollHeight;
    }
  }

  // 输入区可用状态：只有 live / demo 才允许提问
  function syncSendState() {
    const usable = (mode === 'live' || mode === 'demo');
    inputEl.disabled = !usable;
    sendBtn.disabled = !usable || inputEl.value.trim().length === 0;
  }
  inputEl.addEventListener('input', syncSendState);

  // "回到最新"按钮
  const toBottom = document.getElementById('toBottom');
  toBottom.addEventListener('click', () => scrollToBottom(true));
  msgBox.addEventListener('scroll', () => {
    toBottom.classList.toggle('show', !isNearBottom());
  });

  // 发出第一条消息后，收起空状态引导
  function hideEmptyHint() {
    const hint = document.getElementById('emptyHint');
    if (hint) hint.classList.add('hidden');
  }

  // 发送快捷回复
  function sendQuick(text) {
    inputEl.value = text;
    syncSendState();
    sendMessage();
  }

  // 按当前模式刷新提示条与输入区状态
  function applyMode() {
    document.body.dataset.mode = mode;
    const span = document.querySelector('.online-bar span');
    if (span) {
      if (mode === 'live' && tokenReady) {
        span.textContent = '已连接真实智能体：本页由后端代理调用扣子 API，可自由提问';
      } else if (mode === 'live') {
        span.textContent = '后端已启动，但服务端 .env 里还没填 COZE_API_TOKEN，暂时无法对话';
      } else if (mode === 'demo') {
        span.textContent = '本页为界面演示，项目完整实现（人设 Prompt / 知识库 / 对话流设计）见源码仓库';
      } else if (mode === 'unavailable') {
        span.textContent = '服务暂时不可用（后端未就绪），请稍后刷新页面重试';
      } else {
        span.textContent = '正在连接服务…';
      }
    }
    syncSendState();
    inputEl.placeholder = (mode === 'checking')
      ? '连接服务中…'
      : (mode === 'unavailable' ? '服务暂不可用' : '输入您的问题…');
  }

  // 单次健康探测：ok = 可用；static = 确认没有后端；down = 后端存在但还没就绪
  async function probeHealth(timeoutMs) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const resp = await fetch('/api/health', { cache: 'no-store', signal: ctrl.signal });
      if (resp.status === 404 || resp.status === 405) return 'static';  // 静态托管：没有这个接口
      if (!resp.ok) return 'down';                                      // 502/503：后端在启动
      let data = null;
      try { data = await resp.json(); } catch (e) { return 'static'; }   // 回来的不是 JSON，说明不是本项目后端
      if (!data || !data.ok) return 'down';
      tokenReady = !!data.token_ready;
      return 'ok';
    } catch (e) {
      return 'down';   // 网络错误 / 超时：后端可能正在冷启动
    } finally {
      clearTimeout(timer);
    }
  }

  // 探测后端。冷启动（例如 Render 免费实例唤醒，约 50 秒）期间禁用提问并持续重试，
  // 避免用户在这个窗口里拿到「模拟回复」却以为是 AI 回答。
  async function checkBackend() {
    const DEADLINE_MS = 90000;
    const started = Date.now();
    applyMode();

    while (true) {
      const state = await probeHealth(8000);
      if (state === 'ok') { mode = 'live'; applyMode(); return; }
      if (state === 'static') { mode = 'demo'; applyMode(); return; }
      if (Date.now() - started >= DEADLINE_MS) { mode = 'unavailable'; applyMode(); return; }

      const waited = Math.round((Date.now() - started) / 1000);
      const span = document.querySelector('.online-bar span');
      if (span) span.textContent = '正在唤醒服务，请稍候…（已等待 ' + waited + ' 秒）';
      await new Promise(r => setTimeout(r, 3000));
    }
  }

  // 发送消息
  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    // 后端还没就绪 / 不可用时，明确告知，绝不回模拟答案冒充真实回答
    if (mode === 'checking') { addNotice('正在连接服务，请稍候…'); return; }
    if (mode === 'unavailable') { addNotice('服务暂时不可用，请稍后刷新页面重试。'); return; }
    if (sendBtn.dataset.busy === '1') return;   // 上一条还在生成中

    // 显示用户消息
    addMessage(text, 'user');
    inputEl.value = '';
    syncSendState();
    hideEmptyHint();

    if (mode === 'live') {
      streamReply(text);
    } else {
      // 静态托管演示：走内置模拟回复（仅在确认没有后端时才会走到这里）
      const typingId = showTyping();
      setTimeout(() => {
        removeTyping(typingId);
        addMessage(getMockReply(text), 'bot');
      }, 600);
    }
  }

  // 调用后端代理，流式接收智能体回复
  async function streamReply(userMessage) {
    const typingId = showTyping();
    let bubble = null;      // 机器人气泡元素
    let answer = '';        // 已累积的回复文本
    let errored = false;    // 后端已返回错误提示时，不再叠加兜底话术

    sendBtn.dataset.busy = '1';
    sendBtn.disabled = true;

    // 收到第一个字时才创建气泡（避免空回复闪一下）
    function ensureBubble() {
      if (bubble) return bubble;
      removeTyping(typingId);
      const wrap = document.createElement('div');
      wrap.className = 'message bot';
      const el = document.createElement('div');
      el.className = 'bubble streaming';
      wrap.appendChild(el);
      msgBox.appendChild(wrap);
      bubble = el;
      return bubble;
    }

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        credentials: 'same-origin',   // 带上服务端下发的会话 cookie
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: userMessage })
      });

      if (!resp.ok || !resp.body) {
        let detail = '';
        try { detail = (await resp.json()).error || ''; } catch (e) {}
        const err = new Error(detail || ('HTTP ' + resp.status));
        err.fromServer = !!detail;   // 区分"后端明确报错"和"网络断了"
        throw err;
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        // SSE 以空行分隔事件
        const blocks = buffer.split('\n\n');
        buffer = blocks.pop();

        for (const block of blocks) {
          let event = '';
          let data = '';
          for (const line of block.split('\n')) {
            if (line.startsWith('event:')) event = line.slice(6).trim();
            else if (line.startsWith('data:')) data += line.slice(5).trim();
          }
          if (!event) continue;

          // 代理下发四类事件：meta / delta / error / done。
          // meta 里的 conversation_id 由服务端管理（见 server.py SessionStore），
          // 前端不需要也不应该保存，所以这里只处理 delta 和 error，其余忽略。
          if (event === 'delta') {
            let piece = '';
            try { piece = JSON.parse(data).content || ''; } catch (e) {}
            if (piece) {
              const stick = isNearBottom();
              answer += piece;
              ensureBubble().textContent = answer;
              if (stick) scrollToBottom(false);
            }
          } else if (event === 'error') {
            let msg = '智能体暂时无法回答，请稍后再试。';
            try { msg = JSON.parse(data).message || msg; } catch (e) {}
            ensureBubble().textContent = '亲，' + msg;
            errored = true;
          }
        }
      }

      if (!answer && !errored) {
        ensureBubble().textContent = '亲，这个问题我需要帮您转接人工客服确认一下，请稍等哦~ 您也可以拨打客服热线 400-XXX-XXXX（工作日9:00-18:00）😊';
      }
      if (bubble) bubble.classList.remove('streaming');
      const timeEl = document.createElement('div');
      timeEl.className = 'time';
      timeEl.textContent = getTime();
      if (bubble) bubble.parentElement.appendChild(timeEl);

    } catch (error) {
      removeTyping(typingId);
      if (bubble) bubble.classList.remove('streaming');
      addMessage(
        error && error.fromServer
          ? '亲，' + error.message
          : '抱歉，系统暂时无法连接，请稍后再试或拨打客服热线 400-XXX-XXXX。',
        'bot'
      );
      console.error(error);
    } finally {
      sendBtn.dataset.busy = '';
      syncSendState();
    }
  }

  // 内置模拟回复：仅在确认没有后端（静态托管，如 GitHub Pages）时使用。
  // 后端可用时一律走真实对话，绝不回这里的话术冒充 AI 回答。
  function getMockReply(message) {
    const replies = {
      '尺寸': '亲，我们的四件套规格如下：\n• 1.2米床：被套150×200cm\n• 1.5米床：被套200×230cm\n• 1.8米床：被套220×240cm\n购买时请根据床垫尺寸选择对应规格哦~ 😊',
      '洗': '亲，纯棉床品的洗护建议：\n• 水温不超过40度\n• 使用中性洗涤剂\n• 轻柔模式机洗\n• 反面晾晒，避免暴晒\n建议每1-2周更换清洗一次 🛏️',
      '发货': '亲，我们的发货时效：\n• 现货商品：下单后48小时内发货（工作日）\n• 预售商品：7-15天发货\n• 大促期间：可能延迟至72小时\n发货后会短信通知快递单号哦~ 📦',
      '退货': '亲，退换货流程：\n1. 订单页点击"申请售后"\n2. 填写原因并上传照片\n3. 客服审核（2小时内）\n4. 寄回商品，填写快递单号\n5. 签收验货后1-3天退款\n如需帮助随时告诉我~ 😊',
      '优惠': '亲，当前优惠活动：\n• 满199减20 / 满299减40 / 满399减60\n• 满减可与优惠券叠加使用\n• 关注店铺可领专属优惠券\n您可以前往店铺活动页查看更多详情哦~ 🎁'
    };

    for (let key in replies) {
      if (message.includes(key)) return replies[key];
    }

    return '亲，这个问题我需要帮您转接人工客服确认一下，您稍等哦~ 您也可以拨打客服热线 400-XXX-XXXX（工作日9:00-18:00）😊';
  }

  // 添加消息到聊天区
  // 用 textContent 而不是 innerHTML 拼接，避免用户输入被当作 HTML 执行（自 XSS）
  function addMessage(text, sender) {
    const stick = isNearBottom();
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message ' + sender;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = getTime();

    msgDiv.appendChild(bubble);
    msgDiv.appendChild(time);
    msgBox.appendChild(msgDiv);
    if (stick) scrollToBottom(false);
  }

  // 提示行（用于「正在连接」「服务不可用」等系统级说明）
  function addNotice(text) {
    const el = document.createElement('div');
    el.className = 'notice-line';
    el.textContent = text;
    msgBox.appendChild(el);
    scrollToBottom(false);
  }

  // 显示"正在输入"
  function showTyping() {
    const stick = isNearBottom();
    const id = 'typing-' + Date.now();
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message bot';
    msgDiv.id = id;
    msgDiv.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    msgBox.appendChild(msgDiv);
    if (stick) scrollToBottom(false);
    return id;
  }

  // 移除"正在输入"
  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  // 页面加载时探测后端
  checkBackend();
</script>

<!-- ==========================================================
     关于「为什么不用 Coze Chat SDK」
     扣子官方还提供 Chat SDK（右下角悬浮聊天窗），接入更省事，
     但它要求把访问令牌写在前端 JS 里 —— 公开网页等于把账号交出去。
     本项目因此选择 API + 自建后端代理（见 server.py），令牌只留在服务端。
     详细对比见 docs 与仓库 README 的「效果评测 / 技术选型」章节。
     ========================================================== -->
